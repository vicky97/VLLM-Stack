servingEngineSpec:
  runtimeClassName: ''
  imagePullPolicy: IfNotPresent
  strategy:
    type: Recreate
  modelSpec:
    - name: qwen-7b
      repository: vllm/vllm-openai
      tag: v0.31.0
      modelURL: Qwen/Qwen2.5-7B-Instruct
      replicaCount: 1
      requestCPU: 4
      requestMemory: 20Gi
      requestGPU: 1
      pvcStorage: 50Gi
      pvcAccessMode:
        - ReadWriteMany
      storageClass: efs-sc
      vllmConfig:
        enablePrefixCaching: true
        enableChunkedPrefill: true
        maxModelLen: 8192
        dtype: bfloat16
        extraArgs: ['--gpu-memory-utilization', '0.90']
      hf_token:
        secretName: hf-token
        secretKey: token
      nodeSelectorTerms:
        - matchExpressions:
            - key: workload
              operator: In
              values:
                - inference
  tolerations:
    - key: nvidia.com/gpu
      operator: Equal
      value: 'true'
      effect: NoSchedule
routerSpec:
  routingLogic: roundrobin
  repository: lmcache/lmstack-router
  tag: v0.1.13
  imagePullPolicy: IfNotPresent
  startupProbe:
    initialDelaySeconds: 10
    periodSeconds: 10
    failureThreshold: 30
