servingEngineSpec:
  runtimeClassName: ''
  modelSpec:
    - name: qwen-7b
      repository: vllm/vllm-openai
      tag: <pinned-tag>
      modelURL: Qwen/Qwen2.5-7B-Instruct
      replicaCount: 1
      requestCPU: 4
      requestMemory: 20Gi
      requestGPU: 1
      pvcStorage: 50Gi
      pvcAccessMode:
        - ReadWriteMany
      storageClass: efs-sc
      vllmConfig:
        enablePrefixCaching: true
        enableChunkedPrefill: true
        maxModelLen: 8192
        dtype: bfloat16
        extraArgs: ['--gpu-memory-utilization', '0.90']
      hf_token:
        secretName: hf-token
        secretKey: token
  tolerations:
    - key: nvidia.com/gpu
      operator: Equal
      value: 'true'
      effect: NoSchedule
  nodeSelector:
    workload: inference
routerSpec:
  routingLogic: roundrobin