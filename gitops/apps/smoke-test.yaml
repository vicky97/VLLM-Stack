apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: smoke-test
  namespace: argocd
spec:
  project: default
  source:
    repoURL: git@github.com:vicky97/VLLM-Stack.git
    targetRevision: master
    path: gitops/smoke-test
  destination:
    server: https://kubernetes.default.svc
    namespace: smoke-test
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true