apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vllm-stack
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - repoURL: https://vllm-project.github.io/production-stack
      chart: vllm-stack
      targetRevision: 0.1.13
      helm:
        valueFiles:
          - $values/gitops/values/vllm-stack.values.yaml
    - repoURL: git@github.com:vicky97/VLLM-Stack.git
      targetRevision: master
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: llm
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true