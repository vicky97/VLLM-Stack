apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: test-ebs
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: test-efs
spec:
  accessModes: [ReadWriteMany]
  storageClassName: efs-sc
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Pod
metadata:
  name: storage-test
spec:
  containers:
    - name: t
      image: busybox:1.36
      command: ["sh", "-c", "echo ebs > /ebs/hello && echo efs > /efs/hello && ls -l /ebs /efs && sleep 3600"]
      volumeMounts:
        - { name: ebs, mountPath: /ebs }
        - { name: efs, mountPath: /efs }
  volumes:
    - name: ebs
      persistentVolumeClaim: { claimName: test-ebs }
    - name: efs
      persistentVolumeClaim: { claimName: test-efs }